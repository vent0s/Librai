name: librai-dev

services:
  db:
    image: postgres:18.6-bookworm
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_DB: librai
      POSTGRES_USER: librai
      POSTGRES_PASSWORD: ${LIBRAI_DB_PASSWORD:?Set LIBRAI_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql

volumes:
  pgdata: